x-python-user: &python_user
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init_scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 1s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
  log_db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${LOG_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LOG_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LOG_POSTGRES_DB}
    volumes:
      - log_pgdata:/var/lib/postgresql/data
      - ./postgres/init_scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${LOG_POSTGRES_USER} -d ${LOG_POSTGRES_DB}'"]
      interval: 1s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *python_user
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    tty: true
    ports:
      - "${BACKEND_PORT}:8000"
    env_file:
      - ./backend/.env
      - ./postgres/python_core/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_DATABASE_URL: postgresql+asyncpg://${LOG_POSTGRES_USER}:${LOG_POSTGRES_PASSWORD}@log_db:5432/${LOG_POSTGRES_DB}
      PG_BACKUPER_GRPC_HOST: pg_backuper
      PG_BACKUPER_GRPC_PORT: 4040
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
      - ./postgres:/app/postgres
    depends_on:
      db-init:
        condition: service_completed_successfully

  db-init:
    <<: *python_user
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      log_db:
        condition: service_healthy
    env_file:
      - ./postgres/python_core/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_DATABASE_URL: postgresql+asyncpg://${LOG_POSTGRES_USER}:${LOG_POSTGRES_PASSWORD}@log_db:5432/${LOG_POSTGRES_DB}
    command:
      - sh
      - -c
      - |
        alembic -c /app/postgres/python_core/alembic.ini upgrade head
        alembic -c /app/postgres/python_core/alembic_logs.ini upgrade head
        python -m scripts.init_db
    volumes:
      - ./backend:/app/backend
      - ./postgres:/app/postgres

  db-revision:
    <<: *python_user
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["manual"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      log_db:
        condition: service_healthy
    env_file:
      - ./postgres/python_core/.env
    environment:
      REVISION_MESSAGE: manual_revision
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_DATABASE_URL: postgresql+asyncpg://${LOG_POSTGRES_USER}:${LOG_POSTGRES_PASSWORD}@log_db:5432/${LOG_POSTGRES_DB}
    command:
      - sh
      - -c
      - |
        test -n "$$REVISION_MESSAGE"
        alembic -c /app/postgres/python_core/alembic.ini upgrade head
        alembic -c /app/postgres/python_core/alembic.ini revision --autogenerate -m "$$REVISION_MESSAGE"
    volumes:
      - ./backend:/app/backend
      - ./postgres:/app/postgres

  db-revision-logs:
    <<: *python_user
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["manual"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      log_db:
        condition: service_healthy
    env_file:
      - ./postgres/python_core/.env
    environment:
      REVISION_MESSAGE: manual_log_revision
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_DATABASE_URL: postgresql+asyncpg://${LOG_POSTGRES_USER}:${LOG_POSTGRES_PASSWORD}@log_db:5432/${LOG_POSTGRES_DB}
    command:
      - sh
      - -c
      - |
        test -n "$$REVISION_MESSAGE"
        alembic -c /app/postgres/python_core/alembic_logs.ini upgrade head
        alembic -c /app/postgres/python_core/alembic_logs.ini revision --autogenerate -m "$$REVISION_MESSAGE"
    volumes:
      - ./backend:/app/backend
      - ./postgres:/app/postgres

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"

  pg_backuper:
    build:
      context: ./pg_backuper
    restart: always
    depends_on:
      db:
        condition: service_healthy
      log_db:
        condition: service_healthy
    ports:
      - "${PG_BACKUPER_PORT}:4040"
    volumes:
      - ./pg_backuper/config.compose.yaml:/app/config.yaml:ro
      - pg_backuper_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash", "-lc", "'exec 3<>/dev/tcp/127.0.0.1/4040'"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend-test:
    <<: *python_user
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file:
      - ./backend/.env
      - ./postgres/python_core/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      LOG_DATABASE_URL: postgresql+asyncpg://${LOG_POSTGRES_USER}:${LOG_POSTGRES_PASSWORD}@log_db:5432/${LOG_POSTGRES_DB}_test
      PYTHONPATH: /app/backend
    command:
      - sh
      - -c
      - |
        pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
    volumes:
      - ./backend:/app/backend
      - ./postgres:/app/postgres
    depends_on:
      db:
        condition: service_healthy
      log_db:
        condition: service_healthy
    profiles: ["test"]


volumes:
  pgdata:
  log_pgdata:
  pg_backuper_data:
