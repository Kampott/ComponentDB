[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "componentdb-postgres"
version = "0.1.0"
description = "Shared SQLAlchemy models for ComponentDB backend and postgres scripts."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy",
    "alembic",
    "asyncpg",
    "passlib[bcrypt]",
    "psycopg2-binary",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["base", "settings"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["models*", "scripts*"]
