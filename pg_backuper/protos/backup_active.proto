syntax = "proto3";

package pgbackup.v1;

option cc_enable_arenas = true;

// Запрос на начало бэкапа
message StartBackupRequest {
  string database_name = 1;
  int64 template_id = 2;
}

// Ответ на начало бэкапа
message StartBackupResponse {
  int64 backup_id = 1;
}

// Запрос на отмену активного бэкапа
message CancelBackupRequest {
  int64 backup_id = 1;
}

// Результат отмены бэкапа - перечисление
enum CancelBackupResult {
  CANCEL_RESULT_SUCCESS = 0;
  CANCEL_RESULT_NOT_FOUND = 1;
  CANCEL_RESULT_ALREADY_FINISHED = 2;
}

// Результат отмены бэкапа
message CancelBackupResponse {
  CancelBackupResult result = 1;
  optional string message = 2;
}
